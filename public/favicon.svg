	<rect width="64" height="64" rx="14" fill="#0b1f4b"/>
	<!-- steam -->
	<path d="M24 8c-3 4 3 6 0 10M34 8c-3 4 3 6 0 10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
	<!-- cup -->
	<path d="M14 24h32v14a14 14 0 0 1-14 14h-4a14 14 0 0 1-14-14V24Z" fill="#fff"/>
